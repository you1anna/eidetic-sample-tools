[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sampletools"
version = "0.2.0"
description = "Prepare curated samples for Octatrack MKII, Digitakt MKI, and TR-8S."
requires-python = ">=3.12"
dependencies = []  # core uses stdlib + ffmpeg/ffprobe via subprocess

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sample-export = "sampletools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sampletools = ["resources/profiles/devices/*.toml", "resources/profiles/studios/*.toml", "resources/manifests/*.txt"]
