[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "librarytools"
version = "0.2.0"
description = "Safely review, organise, curate, and analyse large sample libraries."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "soundfile>=0.13",
]  # ffmpeg/ffprobe used via subprocess for format fallbacks and duration probes

[project.optional-dependencies]
dev = ["pytest>=8", "flask>=3.1,<4"]
# Drum-role classifier vote (sample-analyze --classifier). Heavy + optional so the core
# tidy tools stay light. Weights are user-supplied (unlicensed upstream), never shipped.
classifier = ["torch>=2.2", "librosa>=0.10"]
audio-classifier = ["torch>=2.6,<3", "librosa>=0.11,<0.12", "transformers>=4.57,<5"]
review-ui = ["flask>=3.1,<4"]

[project.scripts]
sample-classify = "librarytools.classify:main"
sample-dedupe = "librarytools.dedupe:main"
sample-intake = "librarytools.intake:main"
sample-review = "librarytools.review:main"
sample-sort = "librarytools.sort:main"
sample-analyze = "librarytools.analyze:main"
sample-near-dupes = "librarytools.neardupe:main"
sample-role-cleanup = "librarytools.rolecleanup_cli:main"
sample-benchmark = "librarytools.benchmark_cli:main"
sample-profile = "librarytools.profile_cli:main"
sample-curate = "librarytools.curate_cli:main"
sample-tag = "librarytools.tag_cli:main"
sample-find = "librarytools.find_cli:main"
sample-library = "librarytools.library_cli:main"
sample-vibe = "librarytools.vibe_cli:main"
sample-ai = "librarytools.ai_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
librarytools = ["resources/*.toml", "resources/*.html", "resources/*.js", "resources/*.css", "resources/profiles/devices/*.toml", "resources/profiles/studios/*.toml"]
