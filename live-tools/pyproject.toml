[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eidetic-live-tools"
version = "0.2.0"
description = "Independent, preview-first Ableton Live inspection and guarded editing."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
eidetic-live = "eideticlive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eideticlive = ["resources/*.js", "resources/*.maxpat", "_vendor/LICENSE", "_vendor/NOTICE.md"]
