<title id="title">Eidetic Sample Tools architecture</title>
<desc id="description">Your sample library and its index sit together on the sample drive. Library tools find sounds, let you listen in a browser to keep or skip candidates, and approve favourites; optional local AI organises listening. The approved collection passes to sample tools, which create checked WAV copies for Octatrack MKII, Digitakt MKI and TR-8S. Separately, Ableton tools rediscover saved projects without changing them. Optional Live tools inspect a running Set and apply edits after review, and let browser listening audition sounds in Live.</desc>
