<svg xmlns="http://www.w3.org/2000/svg" width="480" height="520" viewBox="0 0 480 520" role="img" aria-labelledby="title description">
  <title id="title">From sample library to hardware</title>
  <desc id="description">Five stages connected in order: index with SHA-256 and SQLite, search with tags and acoustics, audition and label, curate hash-verified favourites, then validate and export with FFmpeg.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L6 3 L0 6" fill="none" stroke="#64748b" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="480" height="520" rx="16" fill="#f1f5f9"/>
  <g fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M240 104 V117"/>
    <path d="M240 202 V215"/>
    <path d="M240 300 V313"/>
    <path d="M240 398 V411"/>
  </g>
  <g fill="#ffffff" stroke="#cbd5e1">
    <rect x="24" y="24" width="432" height="80" rx="12"/>
    <rect x="24" y="122" width="432" height="80" rx="12"/>
    <rect x="24" y="220" width="432" height="80" rx="12"/>
    <rect x="24" y="318" width="432" height="80" rx="12"/>
  </g>
  <rect x="24" y="416" width="432" height="80" rx="12" fill="#0f172a"/>
  <g fill="#ccfbf1">
    <circle cx="60" cy="64" r="19"/>
    <circle cx="60" cy="162" r="19"/>
    <circle cx="60" cy="260" r="19"/>
    <circle cx="60" cy="358" r="19"/>
    <circle cx="60" cy="456" r="19"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <g fill="#115e59" font-size="17" font-weight="700" text-anchor="middle">
      <text x="60" y="70">1</text>
      <text x="60" y="168">2</text>
      <text x="60" y="266">3</text>
      <text x="60" y="364">4</text>
      <text x="60" y="462">5</text>
    </g>
    <g fill="#0f172a" font-size="21" font-weight="700">
      <text x="96" y="59">Index</text>
      <text x="96" y="157">Search</text>
      <text x="96" y="255">Audition</text>
      <text x="96" y="353">Curate</text>
    </g>
    <text x="96" y="451" fill="#ffffff" font-size="21" font-weight="700">Export</text>
    <g fill="#475569" font-size="15">
      <text x="96" y="83">SHA-256 identity + SQLite</text>
      <text x="96" y="181">Tags, acoustics + optional AI</text>
      <text x="96" y="279">Listen, label + select</text>
      <text x="96" y="377">Hash-verified favourite copies</text>
    </g>
    <text x="96" y="475" fill="#cbd5e1" font-size="15">Device validation + FFmpeg</text>
  </g>
</svg>
